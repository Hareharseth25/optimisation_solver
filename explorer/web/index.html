<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAIRO Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f5fbf'/%3E%3Cpath d='M10 7v18M10 16l10-9M13 13l8 12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="wordmark">KAIRO</span>
      <span class="product">Explorer</span>
    </div>
    <div class="tagline">Kernel for Advanced Integer &amp; Real Optimization</div>
    <div class="service" id="service-status" role="status" data-state="checking">Checking service…</div>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Run configuration">
      <form id="run-form" novalidate>
        <fieldset class="group">
          <legend>Model</legend>
          <label class="file-pick" for="model-file">
            <span class="file-pick-action">Choose MPS file…</span>
            <input type="file" id="model-file" accept=".mps,.qps,.MPS,.QPS" aria-describedby="model-state">
          </label>
          <div id="model-state" class="model-state" data-state="empty" aria-live="polite">No model loaded</div>
        </fieldset>

        <fieldset class="group">
          <legend>Solver</legend>
          <div class="field">
            <label for="engine">Engine</label>
            <select id="engine" name="engine"></select>
          </div>
          <div class="field">
            <label for="backend">Backend</label>
            <select id="backend" name="backend" aria-describedby="backend-note"></select>
            <p id="backend-note" class="field-note"></p>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="time-limit">Time limit <span class="unit">s</span></label>
              <input id="time-limit" name="timeLimit" inputmode="decimal" autocomplete="off" placeholder="none">
            </div>
            <div class="field">
              <label for="threads">Threads</label>
              <input id="threads" name="threads" inputmode="numeric" autocomplete="off" placeholder="auto">
            </div>
          </div>
          <div class="field">
            <label for="cuda-device">CUDA device</label>
            <input id="cuda-device" name="cudaDevice" inputmode="numeric" autocomplete="off" placeholder="0" aria-describedby="cuda-note">
            <p id="cuda-note" class="field-note"></p>
          </div>
        </fieldset>

        <div id="form-errors" class="form-errors" role="alert"></div>
        <button type="submit" id="run-button" class="run-button" disabled>Run</button>
        <p class="hint">Options are passed to KAIRO as given; KAIRO validates their values.</p>
      </form>
    </aside>

    <main id="results" class="results" aria-label="Run report" aria-live="polite"></main>
  </div>
</body>
</html>
